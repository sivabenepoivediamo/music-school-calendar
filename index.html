 c+=`0.6 G 0.5 w 0.9 g ${M} ${top-16} ${W-2*M} 16 re B 0 g\n`;

 for(let i=0;i<wk*7;i++){

  if(sh<en.length)c+=tx(x+3,yt-19-r*LN,_('more',en.length-sh),1,7);

}
function mkPdf(P){
 const o=[];
 o[1]='<</Type/Catalog/Pages 2 0 R>>';
 o[2]=`<</Type/Pages/Kids[${P.map((_,i)=>`${6+2*i} 0 R`).join(' ')}]/Count ${P.length}>>`;
 o[3]='<</Type/Font/Subtype/Type1/BaseFont/Courier/Encoding/WinAnsiEncoding>>';
 o[4]='<</Type/Font/Subtype/Type1/BaseFont/Courier-Bold/Encoding/WinAnsiEncoding>>';
 o[5]='<</Type/Font/Subtype/Type1/BaseFont/Courier-Oblique/Encoding/WinAnsiEncoding>>';
 P.forEach((q,i)=>{
  o[6+2*i]=`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${q.w} ${q.h}]/Resources<</Font<</F1 3 0 R/F2 4 0 R/F3 5 0 R>>>>/Contents ${7+2*i} 0 R>>`;
  o[7+2*i]=`<</Length ${q.c.length}>>\nstream\n${q.c}\nendstream`;
 });
 let out='%PDF-1.4\n',xr=[];
 for(let i=1;i<o.length;i++){xr[i]=out.length;out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
 const x=out.length;
 out+=`xref\n0 ${o.length}\n0000000000 65535 f \n`+xr.slice(1).map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${o.length}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 return new Blob([Uint8Array.from(out,ch=>ch.charCodeAt(0))],{type:'application/pdf'});
}
